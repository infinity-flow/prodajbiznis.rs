<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontakt | Prodaj biznis</title>
  <meta name="description" content="Kontaktirajte Prodaj biznis — telefon, email, Instagram ili forma. Odgovaramo u roku od 24 sata.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="kontakt">
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <span class="eyebrow">Odgovaramo u roku od 24 sata</span>
        <h1>Kon<span class="outline">takt</span></h1>
      </div>
    </section>

    <section class="section">
      <div class="wrap form-layout">
        <div>
          <div class="contact-list">
            <div class="contact-item"><small>Telefon</small><a data-site="phone" href="#"></a></div>
            <div class="contact-item"><small>Email</small><a data-site="email" href="#"></a></div>
            <div class="contact-item"><small>Instagram</small><a data-site="instagram" href="#" target="_blank" rel="noopener"></a></div>
            <div class="contact-item"><small>Lokacija</small><span data-site="city"></span></div>
          </div>
          <p class="muted mt-m">Sastanci uživo po dogovoru. Za prodaju biznisa najbrže je da popunite <a href="prodaj-biznis.html" style="text-decoration:underline">formu za procenu</a>.</p>
        </div>

        <div>
          <form data-form data-subject="Upit sa sajta" data-success="contact-success" novalidate>
            <div class="form-step" style="padding-bottom:0">
              <div class="form-step__head"><span class="n">→</span><h3>Pošaljite poruku</h3></div>
              <div class="fields">
                <label class="field"><span>Ime i prezime</span><input name="ime" data-label="Ime i prezime" required autocomplete="name"></label>
                <label class="field"><span>Telefon</span><input name="telefon" data-label="Telefon" type="tel" autocomplete="tel"></label>
                <label class="field"><span>Email</span><input name="email" data-label="Email" type="email" required autocomplete="email"></label>
                <label class="field"><span>Tema</span>
                  <select name="tip" id="c-tip" data-label="Tema" required>
                    <option value="">Izaberite</option>
                    <option>Želim da kupim biznis</option>
                    <option>Želim da prodam biznis</option>
                    <option>Saradnja</option>
                    <option>Drugo</option>
                  </select>
                </label>
                <label class="field field--full"><span>Šifra oglasa <i>(ako se odnosi na oglas)</i></span><input name="oglas" id="c-oglas" data-label="Šifra oglasa" placeholder="npr. PB-104"></label>
                <label class="field field--full"><span>Poruka</span><textarea name="poruka" id="c-msg" data-label="Poruka" required></textarea></label>
              </div>
              <label class="consent"><input type="checkbox" required> <span>Saglasan/na sam da se podaci koriste samo radi odgovora na upit.</span></label>
              <button class="btn btn--lg" type="submit" style="width:100%">Pošalji <span class="arrow">→</span></button>
            </div>
          </form>
          <div class="form-success" id="contact-success" role="status">
            <h3>Poruka je poslata.</h3>
            <p>Javljamo se u roku od 24 sata.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
